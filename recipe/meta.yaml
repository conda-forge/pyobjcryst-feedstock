{% set name = "pyobjcryst" %}
{% set version = "2026.2.0" %}
{% set sha256 = "7b2b0acb836ab168b0a179a13c0df6a09ceb6db3b409c4b1eed2545b04123415" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - coordinate-test-atol.patch

build:
  number: 1
  script:
    - export CMAKE_GENERATOR=Ninja  # [unix]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv -Ccmake.define.BOOST_INCLUDE_DIR="$PREFIX/include"  # [unix]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv -Ccmake.define.BOOST_INCLUDE_DIR="%LIBRARY_INC%"    # [win]
  skip: true  # [py < 312 or py >= 316]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - ninja
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - numpy                               # [build_platform != target_platform]
    - nanobind                            # [build_platform != target_platform]
    - scikit-build-core >=0.10            # [build_platform != target_platform]
    - setuptools-scm >=8                  # [build_platform != target_platform]
  host:
    - python
    - pip
    - scikit-build-core >=0.10
    - setuptools-scm >=8
    - nanobind
    - numpy
    - libboost-headers
  run:
    - python
    - numpy
    - packaging

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest

about:
  home: https://github.com/diffpy/pyobjcryst
  license: LicenseRef-diffpy
  license_file: LICENSE.rst
  summary: 'Open source (the license is 100% compatible with bsd-3 clause) Python bindings to the ObjCryst++ crystallographic library.'
  doc_url: https://pyobjcryst.readthedocs.io/
  dev_url: https://github.com/diffpy/pyobjcryst

extra:
  recipe-maintainers:
    - Tieqiong
    - vincefn
    - pavoljuhas
    - st3107
    - sbillinge
